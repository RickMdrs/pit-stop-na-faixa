<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<defs>
  <symbol id="pp" viewBox="0 0 64 64"><circle cx="34" cy="10" r="6" fill="currentColor"/><path d="M30 19h8l6 14-5 2-4-8-2 10 8 10v15h-6V49l-7-8-3 9-8 12-5-3 8-12 4-14 1-9-5 4v8h-5V24z" fill="currentColor"/></symbol>
  <pattern id="hachura" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255,255,255,0.05)" stroke-width="4"/></pattern>
  <pattern id="zebra" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#1a1a14"/><rect width="5" height="10" fill="#c9a227"/></pattern>
  <radialGradient id="luz"><stop offset="0" stop-color="#fff4c2" stop-opacity="0.55"/><stop offset="1" stop-color="#fff4c2" stop-opacity="0"/></radialGradient>
</defs>
<g transform="scale(2)">
  <rect width="800" height="450" fill="#07080a"/>
  <!-- prédios -->
  <rect x="0" y="0" width="355" height="150" fill="#13161b"/><rect x="0" y="0" width="355" height="150" fill="url(#hachura)"/>
  <rect x="445" y="0" width="355" height="150" fill="#13161b"/><rect x="445" y="0" width="355" height="150" fill="url(#hachura)"/>
  <rect x="0" y="360" width="800" height="90" fill="#13161b"/><rect x="0" y="360" width="800" height="90" fill="url(#hachura)"/>
  <!-- corredor coberto -->
  <rect x="355" y="0" width="90" height="150" fill="#171a20"/>
  <text x="400" y="22" text-anchor="middle" font-size="9" letter-spacing="1.6" fill="#7d8694">CORREDOR</text>
  <text x="400" y="34" text-anchor="middle" font-size="7" fill="#5b6270">coberto · paredes até a via</text>
  <!-- calçadas e via -->
  <rect x="0" y="150" width="355" height="30" fill="#101318"/><rect x="445" y="150" width="355" height="30" fill="#101318"/>
  <rect x="355" y="150" width="90" height="30" fill="#171a20"/>
  <rect x="0" y="180" width="800" height="150" fill="#1b1f26"/>
  <line x1="0" y1="181" x2="800" y2="181" stroke="#3a404b"/><line x1="0" y1="329" x2="800" y2="329" stroke="#3a404b"/>
  <line x1="0" y1="255" x2="355" y2="255" stroke="#d4a62a" stroke-width="2" stroke-dasharray="18 12"/>
  <line x1="445" y1="255" x2="800" y2="255" stroke="#d4a62a" stroke-width="2" stroke-dasharray="18 12"/>
  <rect x="0" y="330" width="800" height="30" fill="#101318"/>
  <!-- vagas junto à saída (limitam a visão) -->
  <rect x="70" y="154" width="74" height="22" rx="5" fill="#2a2f38"/><rect x="160" y="154" width="74" height="22" rx="5" fill="#2a2f38"/><rect x="250" y="154" width="74" height="22" rx="5" fill="#2a2f38"/>
  <!-- faixa de pedestres -->
  <g fill="#d9dde3"><rect x="360" y="186" width="80" height="9"/><rect x="360" y="204" width="80" height="9"/><rect x="360" y="222" width="80" height="9"/><rect x="360" y="240" width="80" height="9"/><rect x="360" y="258" width="80" height="9"/><rect x="360" y="276" width="80" height="9"/><rect x="360" y="294" width="80" height="9"/><rect x="360" y="312" width="80" height="9"/></g>
  <!-- área de espera pintada no fim do corredor + "PARE · OLHE" no piso -->
  
  <!-- área zebrada já existente do outro lado -->
  <rect x="358" y="333" width="84" height="22" fill="url(#zebra)" opacity="0.5"/>
  
  <!-- sentidos -->
  <text x="40" y="300" font-size="14" fill="#5b6270">→</text><text x="752" y="232" font-size="14" fill="#5b6270">←</text>
  <text x="18" y="440" font-size="8" letter-spacing="1.4" fill="#5b6270">PRÉDIO DA FRENTE</text>
</g>
</svg>
